schema_version: 1
repository:
  id: repo_01KYSB18HC76CQSRJDPADC7535
  display_name: rldyour-codex
  roles:
  - project
  - module
  lifecycle: "archived"
provider:
  type: github
  installation: "installation:github-personal"
  repository_id: 1224451487
  owner: "rldyourmnd"
  name: rldyour-codex
  # A transfer keeps the numeric repository id, so this is the same
  # repository under a new locator. The previous one is retained:
  # dropping it would break alias history for anything that resolved
  # the repository by its old path.
  aliases:
    - owner: "NDDev-it-com"
      name: "rldyour-codex"
classification:
  portfolios:
    - "portfolio:archived-projects"
  - portfolio:organization-projects
  visibility_contract: public
  data_classification: public
policy:
  profiles:
  - repository-default
  - personal-default
  rollout_ring: standard
git:
  default_branch: main
  integration: pull-request
  branch_model: task-branches
  handoff_pr: preferred
  cleanup: merged-only
verification:
  commands:
    test:
    - python -m compileall scripts
    - python -c "import json;json.load(open(\".agents/plugins/marketplace.json\"))"
    fast:
    - python -m compileall scripts
  required:
  - test
  - fast
module:
  contract: public
  consumption:
  - git-submodule
  compatibility: commit-contract
  pin_policy: default-branch-commit
  publication:
    github_release: optional
agent:
  context_profile: project-default
  generated_agents: false
  serena:
    enabled: true
    provenance_required: true
release:
  mode: github-release
