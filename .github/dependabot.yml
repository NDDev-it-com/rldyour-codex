version: 2

# Dependabot keeps third-party GitHub Actions visible for review. Runtime
# package freshness is handled by repository validators because Codex/MCP pins
# are distributed across shell installers, TOML agents, and source manifests.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: "devcontainers"
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - devcontainers
    groups:
      devcontainers-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      devcontainers-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
      devcontainers-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
      include: scope
    labels:
      - dependencies
      - docker
    groups:
      docker-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      docker-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - pip
    groups:
      pip-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      pip-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
